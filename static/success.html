<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <title>Sündmused</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Override or adjust styles from styles.css */
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      color: #111;
      text-align: center; /* Keep body text-align center for overall layout */
      overflow-x: hidden; /* Prevent horizontal scrolling on the body */
    } 
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      border-bottom: 0px solid #ddd;
      background-color: #fff;
    }
    header img {
      height: 60px;
      margin-bottom: 1px;
      width: auto;
    }
    details.joined {
      background-color: hsl(322, 50%, 95%); /* Very light purple for the main details background when joined */
    }
    details.joined summary {
        background-color: hsl(322, 50%, 90%); /* Slightly darker light purple for the summary when joined */
        border-bottom: 1px solid hsl(322, 50%, 80%); /* Medium-light purple border */
        padding: 0.4em 0.6em;
    }
    details.cancelled {
      background-color: #f5f5f5; /* Light gray background for cancelled events */
      opacity: 0.6; /* Make cancelled events appear faded */
    }
    details.cancelled summary {
      background-color: #e8e8e8; /* Darker gray for cancelled summary */
      color: #666; /* Gray text color */
      border-bottom: 1px solid #ccc;
      padding: 0.4em 0.6em;
    }
    .lesson-checkmark-icon {
      width: 1.2em;
      height: 1.2em;
      flex-shrink: 0; /* Prevent icon from shrinking */
    }

    /* Styles for list and individual boxes */
    ul { 
      list-style: none;
      padding: 0;
      margin: 0 auto; /* Center the list */
      padding: 0; /* Ensure no extra padding pushing content */
    }
    li {
      margin-bottom: 5px;
      border-radius: 5px;
      overflow: hidden;
    }
    @media (max-width: 468px){
      details {
        text-align: left; /* Ensure content inside details is left-aligned */
        width: calc(100% - 20px); /* Corrected from 40px to 20px to match body padding */
        max-width: none; /* Removed max-width for fluidity on mobile */
        box-sizing: border-box;
        margin: 0.5em auto; /* Center the details box horizontally */
        padding: 5px;
        border: 1px solid #ccc; /* Keep border from styles.css */
        border-radius: 6px; /* Keep border-radius from styles.css */
        background: #f9f9f9; /* Default background for non-joined details */
      }
    }
    details {
      text-align: left; /* Ensure content inside details is left-aligned */
      width: 100%; /* Ensure it takes available width within its parent */
      max-width: 400px; /* MODIFIED: Set a specific max-width for the details box itself */
      margin: 0.5em auto; /* Center the details box horizontally */
      padding: 5px;
      border: 1px solid #ccc; /* Keep border from styles.css */
      border-radius: 6px; /* Keep border-radius from styles.css */
      background: #f9f9f9; /* Default background for non-joined details */
    }
    summary {
      font-weight: bold;
      cursor: pointer;
      padding: 0.4em 0.6em;
      display: flex; /* Use flexbox for alignment */
      align-items: center; /* Vertically center items */
      justify-content: flex-start; /* Align items to the start (left) */
      gap: 0.4em; /* Space between text and icon */
    }
    summary span {
        flex-grow: 0; /* Prevent text from growing unnecessarily */
        white-space: nowrap; /* Keep text on one line if possible */
    }
    details div {
      padding-top: 5px;
    }

    .error-msg {
      color: red;
      font-size: 0.9em;
      margin-top: 5px;
    }
    button {
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8em;
      margin-top: 8px;
    }
    button:hover {
      background-color: hsl(322, 50%, 41%); /* Keep hover color consistent */
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>
    <button onclick="logout()">Logi välja</button>
  </header>

  <h3 id="fixedInfo"></h3>

  <h1>Järgmised tunnid:</h1>
  <p id="joinedCount"></p>
  <ul id="eventList"></ul>

  <h1>Möödunud tunnid:</h1>
  <ul id="pastEventList"></ul>

  <p id="myText">Laen...</p>

  <script>
    // Get the JWT token from localStorage
    let jwtToken = localStorage.getItem('jwtToken');

    function logout() {
      localStorage.removeItem('jwtToken'); // NEW: Remove JWT from localStorage
      window.location.href = '/'; // Redirect to login page
    }

    async function initializePage() {
      // If no token, redirect to login
      if (!jwtToken) {
        window.location.href = '/';
        return;
      }

      let userId = '';
      let group = '';
      let config = {};

      try {
        // Fetch user data using the JWT token
        const meResponse = await fetch('/api/me', {
          headers: {
            'Authorization': `Bearer ${jwtToken}` // NEW: Send JWT in Authorization header
          }
        });

        if (!meResponse.ok) {
          // If token is invalid or expired (e.g., 401/403 response), redirect to login
          localStorage.removeItem('jwtToken'); // Clear invalid token
          window.location.href = '/';
          return;
        }
        const me = await meResponse.json();
        userId = me.id;
        group = me.group;

        console.log('User group:', group); // DEBUG: Log the user's group

        const configResponse = await fetch('/config.json'); // config.json is public, no auth needed
        config = await configResponse.json();

        console.log('Config for group:', config[group]); // DEBUG: Log the config entry for the group
        
        const text = config[group]?.time || '';
        console.log('Fixed time text:', text); // DEBUG: Log the 'time' value

        // Fetch events using the JWT token
        const eventsResponse = await fetch('/api/events', {
          headers: {
            'Authorization': `Bearer ${jwtToken}` // NEW: Send JWT
          }
        });
        const data = await eventsResponse.json();
        const future = data.future || [];
        const past = data.past || [];

        let howmany = 0;
        howmany = future.filter(e => e[6].includes(userId)).length;

        document.getElementById('fixedInfo').textContent = `Sinu grupp on ${group}`;

        document.getElementById('myText').textContent = `Tulemas: ${future.length}, Möödunud: ${past.length}`;

        const render = async (target, list, isFuture = false) => {
          // Batch fetch all participant data at once
          const eventIds = list.map(event => event[5]); // eventId is at index 5
          const participantPromises = eventIds.map(eventId => 
            fetch('/api/getParticipants?eventId=' + eventId, {
              headers: {
                'Authorization': `Bearer ${jwtToken}`
              }
            }).then(res => res.json()).catch(err => {
              console.error('Error fetching participants for event ' + eventId, err);
              return { participants: [], max: 0, group: '', cancelled: false };
            })
          );
          
          const participantResults = await Promise.all(participantPromises);
          const participantData = {};
          eventIds.forEach((eventId, index) => {
            participantData[eventId] = participantResults[index];
          });

          // Process events in parallel without await in the loop
          const eventElements = list.map((event, index) => {
            const [year, month, day, start, end, eventId, joined, isCancelled] = event;
            let hasJoined = joined.includes(userId);

            const details = document.createElement('details');
            if (isCancelled) {
              details.classList.add('cancelled');
            } else if (hasJoined) {
              details.classList.add('joined');
            }

            const summary = document.createElement('summary');
            const summaryTextSpan = document.createElement('span');
            
            if (isCancelled) {
              summaryTextSpan.textContent = `${day}. ${month} ${year}, ${start}–${end} - TÜHISTATUD`;
            } else {
              summaryTextSpan.textContent = `${day}. ${month} ${year}, ${start}–${end}`;
            }

            summary.appendChild(summaryTextSpan);
            if (hasJoined && !isCancelled) {
                const checkmarkImg = document.createElement('img');
                checkmarkImg.src = '/checkbox.png';
                checkmarkImg.alt = 'Joined';
                checkmarkImg.classList.add('lesson-checkmark-icon');
                summary.appendChild(checkmarkImg);
            }

            details.appendChild(summary);

            const body = document.createElement('div');
            const p = document.createElement('p');
            
            // Update participants display with pre-fetched data
            updateParticipantsDisplaySync(p, participantData[eventId], group, config);
            
            body.appendChild(p);

            if (isFuture && !isCancelled) {
              const btn = document.createElement('button');
              btn.textContent = hasJoined ? 'Loobu' : 'Liitu';
              const errorMsg = document.createElement('p');
              errorMsg.className = 'error-msg';
              errorMsg.style.display = 'none';

              btn.onclick = async () => {
                btn.disabled = true;
                const action = btn.textContent === 'Liitu' ? 'join' : 'leave';
                
                // Store original state for potential rollback
                const originalHasJoined = hasJoined;
                const originalBtnText = btn.textContent;
                const originalClasses = [...details.classList];
                const existingIcon = summary.querySelector('.lesson-checkmark-icon');
                
                // Immediately update UI to show optimistic state
                hasJoined = !hasJoined;
                details.classList.toggle('joined');
                btn.textContent = hasJoined ? 'Loobu' : 'Liitu';
                howmany += hasJoined ? 1 : -1;
                document.getElementById('fixedInfo').textContent = `Sinu grupp on ${group}`;

                // Update checkmark icon immediately
                if (hasJoined) {
                    if (!existingIcon) {
                        const checkmarkImg = document.createElement('img');
                        checkmarkImg.src = '/checkbox.png';
                        checkmarkImg.alt = 'Joined';
                        checkmarkImg.classList.add('lesson-checkmark-icon');
                        summary.appendChild(checkmarkImg);
                    }
                } else {
                    if (existingIcon) {
                        existingIcon.remove();
                    }
                }

                try {
                  const res = await fetch(`/api/${action}?eventId=${eventId}`, {
                    headers: {
                      'Authorization': `Bearer ${jwtToken}`
                    }
                  });
                  const result = await res.json();
                  
                  errorMsg.style.display = 'none';
                  if (result.success) {
                    // Success - keep the optimistic changes and update participant list
                    await updateParticipantsDisplay(eventId, p, group, config);
                  } else {
                    // Error - revert the optimistic changes
                    hasJoined = originalHasJoined;
                    btn.textContent = originalBtnText;
                    details.className = '';
                    originalClasses.forEach(cls => details.classList.add(cls));
                    howmany += originalHasJoined ? 1 : -1; // Revert count change
                    document.getElementById('fixedInfo').textContent = `Sinu grupp on ${group}`;
                    
                    // Revert checkmark icon
                    const currentIcon = summary.querySelector('.lesson-checkmark-icon');
                    if (originalHasJoined && !existingIcon && !currentIcon) {
                        const checkmarkImg = document.createElement('img');
                        checkmarkImg.src = '/checkbox.png';
                        checkmarkImg.alt = 'Joined';
                        checkmarkImg.classList.add('lesson-checkmark-icon');
                        summary.appendChild(checkmarkImg);
                    } else if (!originalHasJoined && currentIcon) {
                        currentIcon.remove();
                    }
                    
                    errorMsg.textContent =
                      result.reason === 'too_late'
                        ? 'Ei saa loobuda vähem kui 24h enne algust.'
                        : result.reason === 'full'
                          ? 'Tund on täis.'
                          : 'Toiming ebaõnnestus.';
                    errorMsg.style.display = 'block';
                  }
                } catch (err) {
                  console.error('Fetch error:', err);
                  
                  // Network error - revert the optimistic changes
                  hasJoined = originalHasJoined;
                  btn.textContent = originalBtnText;
                  details.className = '';
                  originalClasses.forEach(cls => details.classList.add(cls));
                  howmany += originalHasJoined ? 1 : -1; // Revert count change
                  document.getElementById('fixedInfo').textContent = `Sinu grupp on ${group}`;
                  
                  // Revert checkmark icon
                  const currentIcon = summary.querySelector('.lesson-checkmark-icon');
                  if (originalHasJoined && !existingIcon && !currentIcon) {
                      const checkmarkImg = document.createElement('img');
                      checkmarkImg.src = '/checkbox.png';
                      checkmarkImg.alt = 'Joined';
                      checkmarkImg.classList.add('lesson-checkmark-icon');
                      summary.appendChild(checkmarkImg);
                  } else if (!originalHasJoined && currentIcon) {
                      currentIcon.remove();
                  }
                  
                  errorMsg.textContent = 'Võrguviga või serveri viga.';
                  errorMsg.style.display = 'block';
                } finally {
                  btn.disabled = false;
                }
              };

              body.appendChild(btn);
              body.appendChild(errorMsg);
            }

            details.appendChild(body);
            const wrapper = document.createElement('li');
            wrapper.appendChild(details);
            return wrapper;
          });

          // Append all elements at once
          eventElements.forEach(element => target.appendChild(element));
        };

        // Synchronous version for pre-fetched data
        function updateParticipantsDisplaySync(paragraphElement, result, userGroup, config) {
          if (result.cancelled) {
            paragraphElement.textContent = 'Tund on tühistatud';
            return;
          }
          
          const participants = result.participants || result || [];
          const maxParticipants = result.max !== undefined ? result.max : (config[userGroup]?.max || Infinity);
          const currentCount = participants.length;
          
          let displayText = '';
          if (maxParticipants !== Infinity) {
            displayText = `${currentCount}/${maxParticipants} inimest on liitunud tunniga:\n`;
          } else {
            displayText = `${currentCount} inimest on liitunud tunniga\n`;
          }
          
          if (participants.length > 0) {
            displayText += participants.map(x => x.fullname).join('\n');
          }
          
          paragraphElement.style.whiteSpace = 'pre-line';
          paragraphElement.textContent = displayText;
        }

        // Keep the original function for individual updates after join/leave
        async function updateParticipantsDisplay(eventId, paragraphElement, userGroup, config) {
          try {
            const participantsRes = await fetch('/api/getParticipants?eventId=' + eventId, {
              headers: {
                'Authorization': `Bearer ${jwtToken}`
              }
            });
            const result = await participantsRes.json();
            updateParticipantsDisplaySync(paragraphElement, result, userGroup, config);
          } catch (err) {
            console.error('Error fetching participants for event ' + eventId, err);
            paragraphElement.textContent = 'Osalejate laadimisel tekkis viga.';
          }
        }

        await render(document.getElementById('eventList'), future, true);
        await render(document.getElementById('pastEventList'), past);

      } catch (error) {
        console.error('Error initializing page:', error);
        localStorage.removeItem('jwtToken'); // Clear token if initialization fails
        window.location.href = '/'; // Redirect to login
                document.getElementById('myText').textContent = '❌ Viga sündmuste laadimisel';
      }
    }
            async function checkAdminAccess() {
            const jwtToken = localStorage.getItem('jwtToken');

            if (!jwtToken) {
                window.location.href = '/';
                return;
            }

            try {
                const response = await fetch('/api/isadmin', {
                    headers: {
                        'Authorization': `Bearer ${jwtToken}`
                    }
                });
                const data = await response.json();
                if (data.admin) {
                    // If user is admin, redirect to admin panel
                    window.location.href = '/admin/index.html';
                    return;
                }
                // If not admin, continue with normal page initialization
                initializePage();
            } catch (error) {
                console.error('Error checking admin status:', error);
                // If there's an error, treat as non-admin and continue
                initializePage();
            }
        }
    document.addEventListener('DOMContentLoaded', checkAdminAccess);
      
    
            async function checkAdminAccess() {
            const jwtToken = localStorage.getItem('jwtToken');

            if (!jwtToken) {
                window.location.href = '/';
                return;
            }

            try {
                const response = await fetch('/api/isadmin', {
                    headers: {
                        'Authorization': `Bearer ${jwtToken}`
                    }
                });
                const data = await response.json();
                if (!data.admin) {
                    window.location.href = '/admin/index.html';
                }
            } catch (error) {
                console.error('Error checking admin status:', error);
                localStorage.removeItem('jwtToken');
                window.location.href = '/';
            }
        }
    document.addEventListener('DOMContentLoaded', checkAdminAccess, initializePage);
  </script>

</body>
</html>
