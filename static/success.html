<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <title>Sündmused</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Ensure no internal scrolling for the iframe content */
    html, body {
      overflow: hidden; /* Prevent scrolling within the iframe itself */
      margin: 0;
      padding: 0;
      height: 100%; /* Ensure body takes full height for scrollHeight calculation */
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #ffffff;
      color: #111;
      text-align: center; /* Center content horizontally */
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      border-bottom: 1px solid #ddd;
      background-color: #fff;
    }
    header img {
      height: 60px;
      width: auto;
    }
    details.joined {
      background-color: hsl(322, 50%, 95%); /* Very light purple for the main details background when joined */
    }
    details.joined summary {
        background-color: hsl(322, 50%, 90%); /* Slightly darker light purple for the summary when joined */
        border-bottom: 1px solid hsl(322, 50%, 80%); /* Medium-light purple border */
        padding: 0.4em 0.6em;
    }
    .lesson-checkmark-icon {
      width: 1.2em;
      height: 1.2em;
      flex-shrink: 0; /* Prevent icon from shrinking */
    }

    ul {
      list-style: none;
      padding: 0;
      max-width: 700px;
      margin: 0 auto;
      padding: 0 10px;
    }
    li {
      margin-bottom: 5px;
      border-radius: 5px;
      overflow: hidden;
    }
    details {
      text-align: left; /* Ensure content inside details is left-aligned */
      max-width: 100%; /* Allow details to take full width of its parent (ul) */
      width: 100%; /* Ensure it takes available width */
      margin: 0.5em auto; /* Adjust margin for individual details boxes */
      padding: 5px;
      border: 1px solid #ccc; /* Keep border from styles.css */
      border-radius: 6px; /* Keep border-radius from styles.css */
      background: #f9f9f9; /* Default background for non-joined details */
    }
    summary {
      font-weight: bold;
      cursor: pointer;
      padding: 0.4em 0.6em;
      display: flex; /* Use flexbox for alignment */
      align-items: center; /* Vertically center items */
      justify-content: flex-start; /* Align items to the start (left) */
      gap: 0.4em; /* Space between text and icon */
    }
    summary span {
        flex-grow: 0; /* Prevent text from growing unnecessarily */
        white-space: nowrap; /* Keep text on one line if possible */
    }
    details div {
      padding-top: 5px;
    }

    .error-msg {
      color: red;
      font-size: 0.9em;
      margin-top: 5px;
    }
    button {
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8em;
      margin-top: 8px;
    }
    button:hover {
      background-color: hsl(322, 50%, 41%); /* Keep hover color consistent */
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>
    <a href="https://guitarium.ee" target="_blank">
      <img src="logo.png" alt="Guitarium logo">
    </a>
    <button onclick="logout()">Logi välja</button>
  </header>

  <h3 id="fixedInfo"></h3>

  <h1>Järgmised tunnid:</h1>
  <p id="joinedCount"></p>
  <ul id="eventList"></ul>

  <h1>Möödunud tunnid:</h1>
  <ul id="pastEventList"></ul>

  <p id="myText">Laen...</p>

  <script>
    // Get the JWT token from localStorage
    let jwtToken = localStorage.getItem('jwtToken');

    // Function to send height to the parent
    function sendHeightToParent() {
      // Use document.body.scrollHeight for the full content height
      const height = document.body.scrollHeight;
      // Send message to the parent window (guitarium.ee)
      window.parent.postMessage({ type: 'iframeHeight', height: height }, 'https://guitarium.ee');
    }

    function logout() {
      localStorage.removeItem('jwtToken'); // NEW: Remove JWT from localStorage
      window.location.href = '/'; // Redirect to login page
    }

    async function initializePage() {
      // If no token, redirect to login
      if (!jwtToken) {
        window.location.href = '/';
        return;
      }

      let userId = '';
      let group = '';
      let config = {};

      try {
        const meResponse = await fetch('/api/me', {
          headers: {
            'Authorization': `Bearer ${jwtToken}`
          }
        });

        if (!meResponse.ok) {
          localStorage.removeItem('jwtToken');
          window.location.href = '/';
          return;
        }
        const me = await meResponse.json();
        userId = me.id;
        group = me.group;

        const configResponse = await fetch('/config.json');
        config = await configResponse.json();

        const text = config[group]?.time || '';
        document.getElementById('fixedInfo').textContent =
          `Oled registreerunud ${group} püsiajaga${text ? ' ' + text : ''}`;
        const maxLimit = config[group]?.max || 6;

        const eventsResponse = await fetch('/api/events', {
          headers: {
            'Authorization': `Bearer ${jwtToken}`
          }
        });
        const data = await eventsResponse.json();
        const future = data.future || [];
        const past = data.past || [];

        let howmany = 0;
        howmany = future.filter(e => e[6].includes(userId)).length;

        document.getElementById('joinedCount').textContent = `Liitunud ${howmany}/${maxLimit} tunniga`;
        document.getElementById('myText').textContent = `Tulemas: ${future.length}, Möödunud: ${past.length}`;

        const render = (target, list, isFuture = false) => {
          list.forEach(event => {
            const [year, month, day, start, end, eventId, joined] = event;
            let hasJoined = joined.includes(userId);

            const details = document.createElement('details');
            if (hasJoined) details.classList.add('joined');

            const summary = document.createElement('summary');
            const summaryTextSpan = document.createElement('span');
            summaryTextSpan.textContent = `${day}. ${month} ${year}, ${start}–${end}`;

            summary.appendChild(summaryTextSpan);
            if (hasJoined) {
                const checkmarkImg = document.createElement('img');
                checkmarkImg.src = '/checkbox.png';
                checkmarkImg.alt = 'Joined';
                checkmarkImg.classList.add('lesson-checkmark-icon');
                summary.appendChild(checkmarkImg);
            }

            details.appendChild(summary);

            const body = document.createElement('div');
            const p = document.createElement('p');
            body.appendChild(p);

            if (isFuture) {
              const btn = document.createElement('button');
              btn.textContent = hasJoined ? 'Loobu' : 'Liitu';
              const errorMsg = document.createElement('p');
              errorMsg.className = 'error-msg';
              errorMsg.style.display = 'none';

              btn.onclick = async () => {
                btn.disabled = true;
                const action = btn.textContent === 'Liitu' ? 'join' : 'leave';
                try {
                  const res = await fetch(`/api/${action}?eventId=${eventId}`, {
                    headers: {
                      'Authorization': `Bearer ${jwtToken}`
                    }
                  });
                  const result = await res.json();
                  
                  errorMsg.style.display = 'none';
                  if (result.success) {
                    hasJoined = !hasJoined;
                    details.classList.toggle('joined');
                    btn.textContent = hasJoined ? 'Loobu' : 'Liitu';
                    howmany += hasJoined ? 1 : -1;
                    document.getElementById('joinedCount').textContent =
                      `Liitunud ${howmany}/${maxLimit} tunniga`;

                    const existingIcon = summary.querySelector('.lesson-checkmark-icon');
                    if (hasJoined) {
                        if (!existingIcon) {
                            const checkmarkImg = document.createElement('img');
                            checkmarkImg.src = '/checkbox.png';
                            checkmarkImg.alt = 'Joined';
                            checkmarkImg.classList.add('lesson-checkmark-icon');
                            summary.appendChild(checkmarkImg);
                        }
                    } else {
                        if (existingIcon) {
                            existingIcon.remove();
                        }
                    }

                    const participantsRes = await fetch('/api/getParticipants?eventId=' + eventId, {
                      headers: {
                        'Authorization': `Bearer ${jwtToken}`
                      }
                    });
                    const participants = await participantsRes.json();
                    p.textContent = 'Osalejad: ' + participants.map(x => x.fullname).join(', ');

                    // Send new height after content change
                    sendHeightToParent();

                  } else {
                    errorMsg.textContent =
                      result.reason === 'too_late'
                        ? 'Ei saa loobuda vähem kui 24h enne algust.'
                        : result.reason === 'overflow'
                          ? 'Sa oled liitunud maksimaalse arvu tunniga'
                          : result.reason === 'full'
                            ? 'Tund on täis.'
                            : 'Toiming ebaõnnestus.';
                    errorMsg.style.display = 'block';
                  }
                } catch (err) {
                  console.error('Fetch error:', err);
                  errorMsg.textContent = 'Võrguviga või serveri viga.';
                  errorMsg.style.display = 'block';
                } finally {
                  btn.disabled = false;
                }
              };

              body.appendChild(btn);
              body.appendChild(errorMsg);
            }

            fetch('/api/getParticipants?eventId=' + eventId, {
              headers: {
                'Authorization': `Bearer ${jwtToken}`
              }
            })
              .then(res => res.json())
              .then(participants => {
                p.textContent = 'Osalejad: ' + participants.map(x => x.fullname).join(', ');
                // Send new height after participants are loaded
                sendHeightToParent();
              })
              .catch(err => {
                console.error('Error fetching initial participants for event ' + eventId, err);
                p.textContent = 'Osalejate laadimisel tekkis viga.';
                sendHeightToParent(); // Send height even on error
              });

            details.appendChild(body);
            const wrapper = document.createElement('li');
            wrapper.appendChild(details);
            target.appendChild(wrapper);
          });
        };

        render(document.getElementById('eventList'), future, true);
        render(document.getElementById('pastEventList'), past);

        // Initial height send after all content is rendered
        sendHeightToParent();

        // Use ResizeObserver to send height updates if content changes (e.g., details expand/collapse)
        const resizeObserver = new ResizeObserver(() => {
            sendHeightToParent();
        });
        resizeObserver.observe(document.body);

      } catch (error) {
        console.error('Error initializing page:', error);
        localStorage.removeItem('jwtToken');
        window.location.href = '/';
        document.getElementById('myText').textContent = '❌ Viga sündmuste laadimisel';
      }
    }

    document.addEventListener('DOMContentLoaded', initializePage);
  </script>
</body>
</html>
