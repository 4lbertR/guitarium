<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <title>Sündmused</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      color: #111;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      border-bottom: 1px solid #ddd;
      background-color: #fff;
    }
    header img {
      height: 60px;
      width: auto;
    }
    details.joined {
      background-color: hsl(322, 50%, 95%); /* Very light purple for the main details background when joined */
    }
    details.joined summary {
        background-color: hsl(322, 50%, 90%); /* Slightly darker light purple for the summary when joined */
        border-bottom: 1px solid hsl(322, 50%, 80%); /* Medium-light purple border */
        padding: 0.6em 0.8em;
    }
    .lesson-checkmark-icon {
      width: 1.2em;
      height: 1.2em;
      vertical-align: middle;
      margin-left: 0.4em; /* Margin to the left, as it's AFTER the text */
    }

    /* Reduced spacing for overall event height */
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin-bottom: 8px; /* Reduced margin between list items */
      border-radius: 5px;
      overflow: hidden;
    }
    details {
      padding: 10px; /* Reduced padding inside details */
      background-color: #f9f9f9; /* Default background for non-joined details */
    }
    summary {
      font-weight: bold;
      cursor: pointer;
      padding: 0.6em 0.8em; /* Reduced padding for summary */
    }
    details div {
      padding-top: 8px; /* Reduced padding above the content inside details */
    }

    .error-msg {
      color: red;
      font-size: 0.9em;
      margin-top: 5px;
    }
    button {
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9em;
      margin-top: 10px;
    }
    button:hover {
      /* This color should now be defined in styles.css */
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>
    <a href="https://guitarium.ee" target="_blank">
      <img src="logo.png" alt="Guitarium logo">
    </a>
    <button onclick="logout()">Logi välja</button>
  </header>

  <h3 id="fixedInfo"></h3>

  <h1>Järgmised tunnid:</h1>
  <p id="joinedCount"></p>
  <ul id="eventList"></ul>

  <h1>Möödunud tunnid:</h1>
  <ul id="pastEventList"></ul>

  <p id="myText">Laen...</p>

  <script>
    function logout() {
      fetch('/logout', { method: 'POST' }).then(() => location.href = '/');
    }

    async function initializePage() {
      let userId = '';
      let group = '';
      let config = {};

      try {
        const meResponse = await fetch('/api/me');
        if (!meResponse.ok) throw new Error('Failed to fetch user data');
        const me = await meResponse.json();
        userId = me.id; // userId is a number
        group = me.group;

        const configResponse = await fetch('/config.json');
        config = await configResponse.json();

        const text = config[group]?.time || '';
        document.getElementById('fixedInfo').textContent =
          `Oled registreerunud ${group} püsiajaga${text ? ' ' + text : ''}`;
        const maxLimit = config[group]?.max || 6;

        const eventsResponse = await fetch('/api/events');
        const data = await eventsResponse.json();
        const future = data.future || [];
        const past = data.past || [];

        let howmany = 0;
        // FIX: Compare numeric userId with numeric IDs in e[6]
        howmany = future.filter(e => e[6].includes(userId)).length;

        document.getElementById('joinedCount').textContent = `Liitunud ${howmany}/${maxLimit} tunniga`;
        document.getElementById('myText').textContent = `Tulemas: ${future.length}, Möödunud: ${past.length}`;

        const render = (target, list, isFuture = false) => {
          list.forEach(event => {
            const [year, month, day, start, end, eventId, joined] = event;
            // FIX: Compare numeric userId with numeric IDs in joined
            let hasJoined = joined.includes(userId);

            const details = document.createElement('details');
            if (hasJoined) details.classList.add('joined');

            const summary = document.createElement('summary');
            const summaryTextSpan = document.createElement('span');
            summaryTextSpan.textContent = `${day}. ${month} ${year}, ${start}–${end}`;

            // Append text first
            summary.appendChild(summaryTextSpan);
            // Then append image if joined
            if (hasJoined) {
                const checkmarkImg = document.createElement('img');
                checkmarkImg.src = '/checkbox.png';
                checkmarkImg.alt = 'Joined';
                checkmarkImg.classList.add('lesson-checkmark-icon');
                summary.appendChild(checkmarkImg);
            }

            details.appendChild(summary);

            const body = document.createElement('div');
            const p = document.createElement('p');
            body.appendChild(p);

            if (isFuture) {
              const btn = document.createElement('button');
              btn.textContent = hasJoined ? 'Loobu' : 'Liitu';
              const errorMsg = document.createElement('p');
              errorMsg.className = 'error-msg';
              errorMsg.style.display = 'none';

              btn.onclick = () => {
                btn.disabled = true;
                const action = btn.textContent === 'Liitu' ? 'join' : 'leave';
                fetch(`/api/${action}?eventId=${eventId}`)
                  .then(res => res.json())
                  .then(result => {
                    errorMsg.style.display = 'none';
                    if (result.success) {
                      hasJoined = !hasJoined;
                      details.classList.toggle('joined');
                      btn.textContent = hasJoined ? 'Loobu' : 'Liitu';
                      howmany += hasJoined ? 1 : -1;
                      document.getElementById('joinedCount').textContent =
                        `Liitunud ${howmany}/${maxLimit} tunniga`;

                      const existingIcon = summary.querySelector('.lesson-checkmark-icon');
                      if (hasJoined) { // User just joined, add icon
                          if (!existingIcon) {
                              const checkmarkImg = document.createElement('img');
                              checkmarkImg.src = '/checkbox.png';
                              checkmarkImg.alt = 'Joined';
                              checkmarkImg.classList.add('lesson-checkmark-icon');
                              summary.appendChild(checkmarkImg); // Append to the end
                          }
                      } else { // User just unjoined, remove icon
                          if (existingIcon) {
                              existingIcon.remove();
                          }
                      }

                      return fetch('/api/getParticipants?eventId=' + eventId)
                        .then(res => res.json())
                        .then(participants => {
                          p.textContent = 'Osalejad: ' + participants.map(x => x.fullname).join(', ');
                        });
                    } else {
                      errorMsg.textContent =
                        result.reason === 'too_late'
                          ? 'Ei saa loobuda vähem kui 24h enne algust.'
                          : result.reason === 'overflow'
                            ? 'Sa oled liitunud maksimaalse arvu tunniga'
                            : result.reason === 'full'
                              ? 'Tund on täis.'
                              : 'Toiming ebaõnnestus.';
                      errorMsg.style.display = 'block';
                    }
                  })
                  .catch(() => {
                    errorMsg.textContent = 'Võrguviga.';
                    errorMsg.style.display = 'block';
                  })
                  .finally(() => {
                    btn.disabled = false;
                  });
              };

              body.appendChild(btn);
              body.appendChild(errorMsg);
            }

            fetch('/api/getParticipants?eventId=' + eventId)
              .then(res => res.json())
              .then(participants => {
                p.textContent = 'Osalejad: ' + participants.map(x => x.fullname).join(', ');
              });

            details.appendChild(body);
            const wrapper = document.createElement('li');
            wrapper.appendChild(details);
            target.appendChild(wrapper);
          });
        };

        render(document.getElementById('eventList'), future, true);
        render(document.getElementById('pastEventList'), past);

      } catch (error) {
        console.error('Error initializing page:', error);
        document.getElementById('myText').textContent = '❌ Viga sündmuste laadimisel';
      }
    }

    document.addEventListener('DOMContentLoaded', initializePage);
  </script>
</body>
</html>
