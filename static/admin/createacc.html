<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    
</head>
<body>

    <div class="container">
        <h2>Create New User Account</h2>
        <form id="createAccountForm">
            <div class="form-group">
                <label for="fullname">Ees- ja perekonnanimi:</label>
                <input type="text" id="fullname" required>
            </div>
            <div class="form-group">
                <label for="password">Parool:</label>
                <input type="password" id="password" required>
            </div>
            <div class="form-group">
                <label for="group">Kasutaja Grupp (e.g., E1, B2):</label>
                <input type="text" id="group" required>
            </div>
            <button type="submit">Create Account</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        document.getElementById('createAccountForm').addEventListener('submit', async (event) => {
            event.preventDefault();

            const fullname = document.getElementById('fullname').value;
            const password = document.getElementById('password').value;
            const group = document.getElementById('group').value;
            const messageDiv = document.getElementById('message');

            messageDiv.style.display = 'none';
            messageDiv.className = '';

            try {
                const response = await fetch('/api/create-account', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ fullname, password, group }) // No admin credentials sent
                });

                const result = await response.json();

                if (response.ok) {
                    messageDiv.textContent = result.message;
                    messageDiv.classList.add('success');
                    document.getElementById('fullname').value = '';
                    document.getElementById('password').value = '';
                    document.getElementById('group').value = '';
                } else {
                    messageDiv.textContent = result.message || 'An unknown error occurred.';
                    messageDiv.classList.add('error');
                }
            } catch (error) {
                console.error('Error:', error);
                messageDiv.textContent = 'Network error or server unreachable.';
                messageDiv.classList.add('error');
            } finally {
                messageDiv.style.display = 'block';
            }
        });
    </script>

</body>
</html>
