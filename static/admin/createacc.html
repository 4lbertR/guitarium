<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/admin/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="create_account">Create Account</title>
    <script src="../translations.js"></script>
</head>
<body>
      <header>
            <button onclick="goBackToAdmin()" data-translate="back_button">Tagasi</button>
        </header>
    <div class="container">
        <h2 data-translate="create_new_user">Lisa uus kasutaja</h2>
        <form id="createAccountForm">
            <div class="form-group">
                <label for="fullname" data-translate="fullname_label">Ees- ja perekonnanimi:</label>
                <input type="text" id="fullname" required>
            </div>
            <div class="form-group">
                <label for="password" data-translate="password_label">Parool:</label>
                <input type="text" id="password" required>
            </div>
            <div class="form-group">
                <label for="group" data-translate="group_label">Kasutaja grupp (nt E1, B2):</label>
                <input type="text" id="group" required>
            </div>
            <button type="submit" data-translate="create_account_button">Loo konto</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        function goBackToAdmin() {
            // Preserve language parameter when going back
            const urlParams = new URLSearchParams(window.location.search);
            const lang = urlParams.get('lang');
            const adminUrl = lang ? `/admin/index.html?lang=${lang}` : '/admin/index.html';
            window.location.href = adminUrl;
        }

        async function checkAdminAccess() {
            const jwtToken = localStorage.getItem('jwtToken');

            if (!jwtToken) {
                const urlParams = new URLSearchParams(window.location.search);
                const lang = urlParams.get('lang');
                const loginUrl = lang ? `/?lang=${lang}` : '/';
                window.location.href = loginUrl;
                return;
            }

            try {
                const response = await fetch('/api/isadmin', {
                    headers: {
                        'Authorization': `Bearer ${jwtToken}`
                    }
                });

                const data = await response.json();

                if (!data.admin) {
                    const urlParams = new URLSearchParams(window.location.search);
                    const lang = urlParams.get('lang');
                    const successUrl = lang ? `/success.html?lang=${lang}` : '/success.html';
                    window.location.href = successUrl;
                }
            } catch (error) {
                console.error('Error checking admin status:', error);
                localStorage.removeItem('jwtToken');
                const urlParams = new URLSearchParams(window.location.search);
                const lang = urlParams.get('lang');
                const loginUrl = lang ? `/?lang=${lang}` : '/';
                window.location.href = loginUrl;
            }
        }

        document.addEventListener('DOMContentLoaded', checkAdminAccess);

        document.getElementById('createAccountForm').addEventListener('submit', async (event) => {
            event.preventDefault();

            const fullname = document.getElementById('fullname').value;
            const password = document.getElementById('password').value;
            const group = document.getElementById('group').value;
            const messageDiv = document.getElementById('message');

            messageDiv.style.display = 'none';
            messageDiv.className = '';

            try {
                const response = await fetch('/api/create-account', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('jwtToken')}` // Ensure token is sent for admin-protected endpoint
                    },
                    body: JSON.stringify({ fullname, password, group })
                });

                const result = await response.json();

                if (response.ok) {
                    messageDiv.textContent = result.message || t('success_message');
                    messageDiv.classList.add('success');
                    document.getElementById('fullname').value = '';
                    document.getElementById('password').value = '';
                    document.getElementById('group').value = '';
                } else {
                    messageDiv.textContent = result.message || t('error_message');
                    messageDiv.classList.add('error');
                }
            } catch (error) {
                console.error('Error:', error);
                messageDiv.textContent = t('network_error_message');
                messageDiv.classList.add('error');
            } finally {
                messageDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
