<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/admin/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

</head>
<body>
      <header>
            <button onclick="window.location.href='/admin/index.html'">Tagasi</button>
        </header>
    <div class="container">
        <select id="groups"></select>
        <button id="deleteGroupButton">Kustuta Grupp</button>
        <div id="message"></div>
    </div>
    
    <script>
        async function checkAdminAccess() {
            const jwtToken = localStorage.getItem('jwtToken');
            if (!jwtToken) {window.location.href = '/';return;}
            try {const response = await fetch('/api/isadmin', {headers: {'Authorization': `Bearer ${jwtToken}`}});
                const data = await response.json();
                if (!data.admin) {
                    window.location.href = '/index.html';
                }
            } catch (error) {localStorage.removeItem('jwtToken');window.location.href = '/';}
        }
        document.addEventListener('DOMContentLoaded', checkAdminAccess);
    </script>
    <script>
        async function loadGroups() {
            const jwtToken = localStorage.getItem('jwtToken');                                                      
                const response = await fetch('/api/getgroups', {
                    headers: {
                        'Authorization': `Bearer ${jwtToken}`
                    }
                });
                const groups = await response.json();
                const dropdown = document.getElementById('groups');
                dropdown.innerHTML = '';
                
                for (let i = 0; i < groups.length; i++) {
                    const option = document.createElement('option');
                    option.value = groups[i];
                    option.textContent = groups[i];
                    dropdown.appendChild(option);
                }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            checkAdminAccess();
            loadGroups();
        });

        document.getElementById('deleteGroupButton').addEventListener('click', async function() {
            const jwtToken = localStorage.getItem('jwtToken');
            const group = document.getElementById('groups').value;
            

            if (!confirm(`Kas oled kindel, et tahad kustutada grupi "${group}" ja kõik selle kasutajad?`)) {
                return; 
            }
            
            const response = await fetch('/api/deletegroup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${jwtToken}`
                },
                body: JSON.stringify({ group })
                });

                if (response.ok) {
                    document.getElementById('message').textContent = `Grupp ${group} on edukalt kustutatud.`;
                    loadGroups(); // Refresh the group list
                } else {
                    const errorData = await response.json();
                    document.getElementById('message').textContent = `Viga: ${errorData.message}`;
                }
        });

    </script>
</body>
</html>
