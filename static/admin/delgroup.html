<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/admin/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="delete_group_title">Delete Group</title>
    <script src="../translations.js"></script>
</head>
<body>
      <header>
            <button onclick="goBackToAdmin()" data-translate="back_button">Tagasi</button>
        </header>
    <div class="container">
        <select id="groups"></select>
        <button id="deleteGroupButton" data-translate="delete_group_button">Kustuta Grupp</button>
        <div id="message"></div>
    </div>
    
    <script>
        function goBackToAdmin() {
            // Preserve language parameter when going back
            const urlParams = new URLSearchParams(window.location.search);
            const lang = urlParams.get('lang');
            const adminUrl = lang ? `/admin/index.html?lang=${lang}` : '/admin/index.html';
            window.location.href = adminUrl;
        }

        async function checkAdminAccess() {
            const jwtToken = localStorage.getItem('jwtToken');
            if (!jwtToken) {
                const urlParams = new URLSearchParams(window.location.search);
                const lang = urlParams.get('lang');
                const loginUrl = lang ? `/?lang=${lang}` : '/';
                window.location.href = loginUrl;
                return;
            }
            try {
                const response = await fetch('/api/isadmin', {headers: {'Authorization': `Bearer ${jwtToken}`}});
                const data = await response.json();
                if (!data.admin) {
                    const urlParams = new URLSearchParams(window.location.search);
                    const lang = urlParams.get('lang');
                    const successUrl = lang ? `/success.html?lang=${lang}` : '/success.html';
                    window.location.href = successUrl;
                }
            } catch (error) {
                localStorage.removeItem('jwtToken');
                const urlParams = new URLSearchParams(window.location.search);
                const lang = urlParams.get('lang');
                const loginUrl = lang ? `/?lang=${lang}` : '/';
                window.location.href = loginUrl;
            }
        }
        document.addEventListener('DOMContentLoaded', checkAdminAccess);
    </script>
    <script>
        async function loadGroups() {
            const jwtToken = localStorage.getItem('jwtToken');                                                      
                const response = await fetch('/api/getgroups', {
                    headers: {
                        'Authorization': `Bearer ${jwtToken}`
                    }
                });
                const groups = await response.json();
                const dropdown = document.getElementById('groups');
                dropdown.innerHTML = '';
                
                for (let i = 0; i < groups.length; i++) {
                    const option = document.createElement('option');
                    option.value = groups[i];
                    option.textContent = groups[i];
                    dropdown.appendChild(option);
                }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            checkAdminAccess();
            loadGroups();
        });

        document.getElementById('deleteGroupButton').addEventListener('click', async function() {
            const jwtToken = localStorage.getItem('jwtToken');
            const group = document.getElementById('groups').value;
            

            if (!confirm(`Kas oled kindel, et tahad kustutada grupi "${group}" ja kõik selle kasutajad?`)) {
                return; 
            }
            
            const response = await fetch('/api/deletegroup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${jwtToken}`
                },
                body: JSON.stringify({ group })
                });

                if (response.ok) {
                    document.getElementById('message').textContent = `Grupp ${group} on edukalt kustutatud.`;
                    loadGroups(); // Refresh the group list
                } else {
                    const errorData = await response.json();
                    document.getElementById('message').textContent = `Viga: ${errorData.message}`;
                }
        });

    </script>
</body>
</html>
