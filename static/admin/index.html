<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
</head>
<body>

    <form action="/admin/createacc.html">
        <button>Loo Konto</button>
    </form>

    <form action="/admin/delacc.html">
        <button>Kustuta Konto</button>
    </form>
    <form action="/admin/createlesson.html">
        <button>Lisa tund</button>
    </form>
    <form action="/admin/delgroup.html">
        <button>Kustuta grupp</button>
    </form>

    <script>
        async function checkAdminAccess() {
            const jwtToken = localStorage.getItem('jwtToken');

            if (!jwtToken) {
                window.location.href = '/';
                return;
            }

            try {
                const response = await fetch('/api/isadmin', {
                    headers: {
                        'Authorization': `Bearer ${jwtToken}`
                    }
                });
                const data = await response.json();
                if (!data.admin) {
                    window.location.href = '/success.html';
                }
            } catch (error) {
                console.error('Error checking admin status:', error);
                localStorage.removeItem('jwtToken');
                window.location.href = '/';
            }
        }

        document.addEventListener('DOMContentLoaded', checkAdminAccess);
    </script>
</body>
</html>
