<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="admin_title">Admin Panel</title>
    <script src="../translations.js"></script>
</head>
<body>

    <form action="/admin/createacc.html">
        <button data-translate="create_account">Loo konto</button>
    </form>
        <form action="/admin/editacc.html">
        <button data-translate="edit_user">Muuda kasutaja andmeid</button>
    </form>
    <form action="/admin/createlesson.html">
        <button data-translate="add_lesson">Lisa tund</button>
    </form>
    <form action="/admin/delgroup.html">
        <button data-translate="delete_group">Kustuta grupp</button>
    </form>
    <form action="/admin/bulkadd.html">
        <button data-translate="import_sheets">Impotri google sheetsist</button>
    </form>

    <script>
        async function checkAdminAccess() {
            const jwtToken = localStorage.getItem('jwtToken');

            if (!jwtToken) {
                // Preserve language parameter when redirecting
                const urlParams = new URLSearchParams(window.location.search);
                const lang = urlParams.get('lang');
                const loginUrl = lang ? `/?lang=${lang}` : '/';
                window.location.href = loginUrl;
                return;
            }

            try {
                const response = await fetch('/api/isadmin', {
                    headers: {
                        'Authorization': `Bearer ${jwtToken}`
                    }
                });
                const data = await response.json();
                if (!data.admin) {
                    // Preserve language parameter when redirecting
                    const urlParams = new URLSearchParams(window.location.search);
                    const lang = urlParams.get('lang');
                    const successUrl = lang ? `/success.html?lang=${lang}` : '/success.html';
                    window.location.href = successUrl;
                }
            } catch (error) {
                console.error('Error checking admin status:', error);
                localStorage.removeItem('jwtToken');
                // Preserve language parameter when redirecting
                const urlParams = new URLSearchParams(window.location.search);
                const lang = urlParams.get('lang');
                const loginUrl = lang ? `/?lang=${lang}` : '/';
                window.location.href = loginUrl;
            }
        }

        document.addEventListener('DOMContentLoaded', checkAdminAccess);
    </script>
</body>
</html>
