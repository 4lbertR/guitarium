<!DOCTYPE html>
<html lang="et">
<head>
    <link rel="stylesheet" href="/admin/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registreeri kasutajaid</title>

</head>
<body>
    <header>
        <button onclick="window.location.href='/admin/index.html'">Tagasi</button>
    </header>
    <div class="container">
        <h2>Registreeri kasutajaid tundidesse</h2>
  <label for="users">Vali kasutaja:</label>
  <select id="users"></select>
  <div id="user-group" style="margin-top: 10px; font-weight: bold;"></div>
  <div id="lessons-container" style="margin-top: 20px;"></div>
  <button id="register-btn" onclick="registerForLessons()" style="margin-top: 20px; display: none;">Registreeri valitud tundidele</button>
  <div id="message" style="margin-top: 20px;"></div>
    </div>
    <script>
      async function checkAdminAccess() {
        const jwtToken = localStorage.getItem('jwtToken');
        if (!jwtToken) {window.location.href = '/';return;}
        try {const response = await fetch('/api/isadmin', {headers: {'Authorization': `Bearer ${jwtToken}`}});
            const data = await response.json();
                if (!data.admin) {
                    window.location.href = '/index.html';
                }
        } catch (error) {localStorage.removeItem('jwtToken');window.location.href = '/';}
      }
      document.addEventListener('DOMContentLoaded', checkAdminAccess);
    </script>
    <script>
      async function loadusers() {
        const jwtToken = localStorage.getItem('jwtToken');
        if (!jwtToken) {window.location.href = '/';return;}
        const response = await fetch('/api/getusers', {
              headers: {
                'Authorization': `Bearer ${jwtToken}`
              }
            });
            const users = await response.json();
            const dropdown = document.getElementById('users');
            dropdown.innerHTML = '<option value="">Vali kasutaja</option>';
            users.sort((a, b) => a.localeCompare(b));
            for (let i = 0; i < users.length; i++) {
              const option = document.createElement('option');
              option.value = users[i];
              option.textContent = users[i];
              dropdown.appendChild(option);
            }
      }
      
      document.getElementById('users').addEventListener('change', async function() {
        const user = this.value;
        const lessonsContainer = document.getElementById('lessons-container');
        const registerBtn = document.getElementById('register-btn');
        const userGroupDiv = document.getElementById('user-group');

        if (user) {
            try {
              // Get user group
              const userInfoResponse = await fetch('/api/getuser', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${localStorage.getItem('jwtToken')}`,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({ user })
              });
              const userInfo = await userInfoResponse.json();
              if (userInfo.success && userInfo.group) {
                userGroupDiv.textContent = `Kasutaja grupp: ${userInfo.group}`;
              } else {
                userGroupDiv.textContent = '';
              }

              const response = await fetch(`/api/getuserlessons?user=${user}`, {
                headers: {
                    'Authorization': `Bearer ${localStorage.getItem('jwtToken')}`
                }
              });
              let lessons = await response.json();

              lessonsContainer.innerHTML = '<h3>Tunnid:</h3>';

              if (!Array.isArray(lessons) || lessons.length === 0) {
                lessonsContainer.innerHTML += '<p>Tulevasi tunde ei leitud.</p>';
                registerBtn.style.display = 'none';
                return;
              }

              // Remove artificial lesson limit for admin view

              lessons.forEach(lesson => {
                const checkboxDiv = document.createElement('div');
                checkboxDiv.style.marginBottom = '10px';
                checkboxDiv.style.display = 'flex';
                checkboxDiv.style.alignItems = 'center';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `lesson-${lesson.id}`;
                checkbox.value = lesson.id;

                // Kontrolli, kas kasutaja on juba registreeritud
                const isRegistered = lesson.isJoined === true;
                if (isRegistered) {
                  checkbox.checked = true;
                }

                const label = document.createElement('label');
                label.htmlFor = `lesson-${lesson.id}`;
                label.textContent = lesson.name || `Tund ${lesson.id}`;
                label.style.marginLeft = '10px';

                // Stiili registreeritud tunde erinevalt
                if (isRegistered) {
                  label.style.color = '#28a745';
                  label.style.fontWeight = 'bold';
                }

                checkboxDiv.appendChild(checkbox);
                checkboxDiv.appendChild(label);
                lessonsContainer.appendChild(checkboxDiv);
              });

              registerBtn.style.display = 'block';

            } catch (error) {
              console.error('Viga kasutaja tundide laadimisel:', error);
              lessonsContainer.innerHTML = '<p>Viga tundide laadimisel</p>';
              registerBtn.style.display = 'none';
              userGroupDiv.textContent = '';
            }
        } else {
            lessonsContainer.innerHTML = '';
            registerBtn.style.display = 'none';
            userGroupDiv.textContent = '';
        }
      });

      async function registerForLessons() {
        const jwtToken = localStorage.getItem('jwtToken');
        const user = document.getElementById('users').value;
        const selectedLessons = Array.from(document.querySelectorAll('#lessons-container input[type="checkbox"]:checked'))
            .map(checkbox => checkbox.value);
        
        if (!jwtToken || !user) {
            document.getElementById('message').textContent = 'Palun vali kasutaja ja veendu, et oled sisse logitud.';
            return;
        }
        
        if (selectedLessons.length === 0) {
            document.getElementById('message').textContent = 'Palun vali vähemalt üks tund.';
            return;
        }
        
        document.getElementById('message').textContent = 'Registreeritakse kasutajat tundidele...';
        
        try {
            const response = await fetch('/api/registerforlesson', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${jwtToken}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ user, lessons: selectedLessons })
            });
            const result = await response.json();
            
            if (result.success) {
                document.getElementById('message').textContent = result.message;
                document.getElementById('message').style.color = 'green';
                
                // Värskenda tundide nimekirja, et näidata uuendatud saadavust
                document.getElementById('users').dispatchEvent(new Event('change'));
            } else {
                document.getElementById('message').textContent = result.message || 'Registreerimine ebaõnnestus';
                document.getElementById('message').style.color = 'red';
            }
        } catch (error) {
            console.error('Viga tundidele registreerimisel:', error);
            document.getElementById('message').textContent = 'Tundidele registreerimine ebaõnnestus.';
            document.getElementById('message').style.color = 'red';
        }
      }

      
      document.addEventListener('DOMContentLoaded', function() {
        checkAdminAccess();
        loadusers();
      });

    </script>
</body>
</html>
