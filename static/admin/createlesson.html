<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

</head>
<body>
    <header>
        
    </header>
    <div class="container">
        <select id="groups"></select>

    </div>
    
    <script>
        //ADMIN CHECK
        async function checkAdminAccess() {
            const jwtToken = localStorage.getItem('jwtToken');
            if (!jwtToken) {window.location.href = '/';return;}
            try {const response = await fetch('/api/isadmin', {headers: {'Authorization': `Bearer ${jwtToken}`}});
                const data = await response.json();
                if (!data.admin) {window.location.href = '/success.html';}
            } catch (error) {localStorage.removeItem('jwtToken');window.location.href = '/';}
        }
        document.addEventListener('DOMContentLoaded', checkAdminAccess);
    </script>
    <script>
        async function loadGroups() {
            const jwtToken = localStorage.getItem('jwtToken');
                const response = await fetch('/api/getgroups', {
                    headers: {
                        'Authorization': `Bearer ${jwtToken}`
                    }
                });
                const groups = await response.json();
                const dropdown = document.getElementById('groups');
                dropdown.innerHTML = '';
                
                for (let i = 0; i < groups.length; i++) {
                    const option = document.createElement('option');
                    option.value = groups[i];
                    option.textContent = groups[i];
                    dropdown.appendChild(option);
                }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            checkAdminAccess();
            loadGroups();
        });
    </script>
</body>
</html>
