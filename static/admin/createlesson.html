<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

</head>
<body>
    <header>
        
    </header>
    <div class="container">
        <h2>Lisa uus kasutaja</h2>
        <select" id="groups"></select>
        <form id="createAccountForm">   
            <div class="form-group">
                <label for="fullname">Ees- ja perekonnanimi:</label>
                <input type="text" id="fullname" required>
            </div>
            <div class="form-group">
                <label for="password">Parool:</label>
                <input type="password" id="password" required>
            </div>
            <div class="form-group">
                <label for="group">Kasutaja grupp (nt E1, B2):</label>
                <input type="text" id="group" required>
            </div>
            <button type="submit">Loo konto</button>
        </form>
        <div id="message"></div>
    </div>
    
    <script>
        //ADMIN CHECK
        async function checkAdminAccess() {
            const jwtToken = localStorage.getItem('jwtToken');
            if (!jwtToken) {window.location.href = '/';return;}
            try {const response = await fetch('/api/isadmin', {headers: {'Authorization': `Bearer ${jwtToken}`}});
                const data = await response.json();
                if (!data.admin) {window.location.href = '/success.html';}
            } catch (error) {localStorage.removeItem('jwtToken');window.location.href = '/';}
        }
        document.addEventListener('DOMContentLoaded', checkAdminAccess);
    </script>
    <script>
        const x = ['group 1', 'group 2', 'group 3', 'group 4'];
        const dropdown = document.getElementById('myDropdown');
        dropdown.innerHTML = '';
        for (let i = 0; i < x.length; i++) {
        const group = document.createElement('group');
        group.value = i;
        group.textContent = x[i];
        dropdown.appendChild(group);
        }
    </script>
</body>
</html>
