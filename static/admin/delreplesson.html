<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/admin/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete/Replace Lesson</title>
</head>
<body>
    <header>
    </header>
    <div class="container">
        <h2>Kustuta/Asenda Tund</h2>
        
        <label for="events">Vali Tund:</label>
        <select id="events">
            <option value="">Laadimine...</option>
        </select>
        
        <div id="recurringOptions" style="display: none;">
            <label for="deleteType">Kustutamise Tüüp:</label>
            <select id="deleteType">
                <option value="single">Ainult üks tund</option>
                <option value="all">Kõik tunnid</option>
                <option value="after">Kõik pärast kindlat kuupäeva</option>
            </select>
            
            <div id="singleEventSelect" style="display: none;">
                <label for="singleEvents">Vali Konkreetne Tund:</label>
                <select id="singleEvents"></select>
            </div>
            
            <div id="afterDateSelect" style="display: none;">
                <label for="afterEvents">Vali Alates Millest Kuupäevast:</label>
                <select id="afterEvents"></select>
            </div>
        </div>
        
        <button id="deleteButton">Kustuta Tund</button>
        <div id="message"></div>
    </div>
    
    <script>
        async function checkAdminAccess() {
            const jwtToken = localStorage.getItem('jwtToken');
            if (!jwtToken) {window.location.href = '/';return;}
            try {const response = await fetch('/api/isadmin', {headers: {'Authorization': `Bearer ${jwtToken}`}});
                const data = await response.json();
                if (!data.admin) {window.location.href = '/success.html';}
            } catch (error) {localStorage.removeItem('jwtToken');window.location.href = '/';}
        }
        document.addEventListener('DOMContentLoaded', checkAdminAccess);
    </script>

    <script>
        let allEvents = [];
        
        async function loadEvents() {
            const jwtToken = localStorage.getItem('jwtToken');
            const response = await fetch('/api/getevents-admin', {
                headers: {
                    'Authorization': `Bearer ${jwtToken}`
                }
            });
            const events = await response.json();
            allEvents = events;
            
            const dropdown = document.getElementById('events');
            dropdown.innerHTML = '<option value="">Vali tund...</option>';
            
            events.forEach((event, index) => {
                const option = document.createElement('option');
                option.value = index;
                
                const startDate = new Date(event.start);
                const endDate = new Date(event.end);
                const dateStr = `${startDate.getDate().toString().padStart(2, '0')}.${(startDate.getMonth() + 1).toString().padStart(2, '0')}`;
                const timeStr = `${startDate.getHours().toString().padStart(2, '0')}.${startDate.getMinutes().toString().padStart(2, '0')}-${endDate.getHours().toString().padStart(2, '0')}.${endDate.getMinutes().toString().padStart(2, '0')}`;
                
                if (event.recurring) {
                    option.textContent = `${event.group} ${timeStr} ${event.recurring.toUpperCase()} ${dateStr}`;
                } else {
                    option.textContent = `${event.group} ${timeStr} ${dateStr}`;
                }
                
                dropdown.appendChild(option);
            });
        }
        
        document.getElementById('events').addEventListener('change', function() {
            const selectedIndex = this.value;
            const recurringDiv = document.getElementById('recurringOptions');
            
            if (selectedIndex === '') {
                recurringDiv.style.display = 'none';
                return;
            }
            
            const selectedEvent = allEvents[selectedIndex];
            if (selectedEvent.recurring) {
                recurringDiv.style.display = 'block';
                loadRecurringOptions(selectedEvent);
            } else {
                recurringDiv.style.display = 'none';
            }
        });
        
        document.getElementById('deleteType').addEventListener('change', function() {
            const singleDiv = document.getElementById('singleEventSelect');
            const afterDiv = document.getElementById('afterDateSelect');
            
            singleDiv.style.display = 'none';
            afterDiv.style.display = 'none';
            
            if (this.value === 'single') {
                singleDiv.style.display = 'block';
            } else if (this.value === 'after') {
                afterDiv.style.display = 'block';
            }
        });
        
        async function loadRecurringOptions(event) {
            const jwtToken = localStorage.getItem('jwtToken');
            const response = await fetch('/api/getrecurring-instances', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${jwtToken}`
                },
                body: JSON.stringify({ eventId: event.id })
            });
            const instances = await response.json();
            
            // Populate single events dropdown
            const singleSelect = document.getElementById('singleEvents');
            singleSelect.innerHTML = '';
            instances.slice(0, 20).forEach((instance, index) => {
                const option = document.createElement('option');
                option.value = instance.id;
                const date = new Date(instance.start);
                const dateStr = `${date.getDate().toString().padStart(2, '0')}.${(date.getMonth() + 1).toString().padStart(2, '0')}.${date.getFullYear()}`;
                option.textContent = `${dateStr}`;
                singleSelect.appendChild(option);
            });
            
            // Populate after date dropdown
            const afterSelect = document.getElementById('afterEvents');
            afterSelect.innerHTML = '';
            instances.slice(0, 20).forEach((instance, index) => {
                const option = document.createElement('option');
                option.value = instance.start;
                const date = new Date(instance.start);
                const dateStr = `${date.getDate().toString().padStart(2, '0')}.${(date.getMonth() + 1).toString().padStart(2, '0')}.${date.getFullYear()}`;
                option.textContent = `Alates ${dateStr}`;
                afterSelect.appendChild(option);
            });
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            checkAdminAccess();
            loadEvents();
        });

        document.getElementById('deleteButton').addEventListener('click', async function() {
            const jwtToken = localStorage.getItem('jwtToken');
            const selectedIndex = document.getElementById('events').value;
            
            if (!selectedIndex) {
                document.getElementById('message').textContent = 'Palun vali tund';
                return;
            }
            
            const selectedEvent = allEvents[selectedIndex];
            let deleteData = { eventId: selectedEvent.id };
            
            if (selectedEvent.recurring) {
                const deleteType = document.getElementById('deleteType').value;
                deleteData.deleteType = deleteType;
                
                if (deleteType === 'single') {
                    deleteData.instanceId = document.getElementById('singleEvents').value;
                } else if (deleteType === 'after') {
                    deleteData.afterDate = document.getElementById('afterEvents').value;
                }
                
                if (!confirm(`Kas oled kindel, et tahad kustutada ${deleteType === 'all' ? 'kõik tunnid' : deleteType === 'single' ? 'ühe tunni' : 'tunnid alates valitud kuupäevast'}?`)) {
                    return;
                }
            } else {
                if (!confirm(`Kas oled kindel, et tahad kustutada tunni "${selectedEvent.group}"?`)) {
                    return;
                }
            }
            
            const response = await fetch('/api/delete-lesson', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${jwtToken}`
                },
                body: JSON.stringify(deleteData)
            });
            
            const result = await response.json();
            document.getElementById('message').textContent = result.message;
            
            if (result.success) {
                loadEvents(); // Refresh the list
            }
        });
    </script>
</body>
</html>
