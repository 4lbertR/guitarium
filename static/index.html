<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guitarium Login</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Ensure no internal scrolling for the iframe content */
    html, body {
      overflow: hidden; /* Prevent scrolling within the iframe itself */
      margin: 0;
      padding: 0;
      height: 100%; /* Ensure body takes full height for scrollHeight calculation */
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0f2f5;
      color: #333;
      text-align: center; /* Center content horizontally */
    }

    .login-container {
      background-color: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      margin: 50px auto; /* Add top/bottom margin and center */
      box-sizing: border-box;
    }
    h1 {
      color: #007bff;
      margin-bottom: 20px;
    }
    input[type="text"],
    input[type="password"] {
      width: calc(100% - 20px);
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1em;
      width: 100%;
    }
    button:hover {
      background-color: hsl(322, 50%, 41%);
    }
    #errorMessage {
      color: red;
      margin-top: 10px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Logi sisse</h1>
    <input type="text" id="fullname" placeholder="Täisnimi" required>
    <input type="password" id="password" placeholder="Parool" required>
    <button onclick="login()">Logi sisse</button>
    <p id="errorMessage"></p>
  </div>

  <script>
    // Function to send height to the parent
    function sendHeightToParent() {
      // Use document.body.scrollHeight for the full content height
      const height = document.body.scrollHeight;
      // Send message to the parent window (guitarium.ee)
      window.parent.postMessage({ type: 'iframeHeight', height: height }, 'https://guitarium.ee');
    }

    async function login() {
      const fullname = document.getElementById('fullname').value.trim();
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('errorMessage');
      errorMessage.textContent = '';

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ fullname, password })
        });

        const data = await response.json();

        if (data.success) {
          localStorage.setItem('jwtToken', data.token); // Store JWT in localStorage
          // Redirect the iframe itself to the success page
          window.location.href = '/success.html'; // This will load success.html inside the current iframe
        } else {
          errorMessage.textContent = 'Vale nimi või parool.';
        }
      } catch (error) {
        console.error('Login error:', error);
        errorMessage.textContent = 'Võrguviga või serveri viga.';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      sendHeightToParent(); // Send initial height on load
      // Use ResizeObserver to send height updates if content changes (though less likely on login page)
      const resizeObserver = new ResizeObserver(() => {
          sendHeightToParent();
      });
      resizeObserver.observe(document.body);
    });
  </script>
</body>
</html>
