  <title>Guitarium Login</title>

<body onload="loggedin()">
  <h1>Logi sisse</h1>
  <form onsubmit="event.preventDefault(); login();">
    <input type="text" id="fullname" placeholder="Ees- ja perekonnanimi" required>
    <input type="password" id="password" placeholder="Parool" required>
    <button type="submit">Logi sisse</button>
  </form>
  <p>Või <a href="/Forgot.html">Unustasid parooli?</a></p>
  <p id="errorMessage" style="color: red;"></p>

  <script>
  function loggedin() {
      const token = localStorage.getItem('jwtToken');
      if (token) {
          console.log('User is logged in. Redirecting...');
          window.location.href = '/success.html';
      } else {
          console.log('User is not logged in.');
      }
  }
    async function login() {
      const fullname = document.getElementById('fullname').value.trim();
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('errorMessage');
      errorMessage.textContent = '';

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ fullname, password })
        });

        const data = await response.json();

        if (data.success) {

</body>
</html>
