<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guitarium Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Logi sisse</h1>
  <form onsubmit="event.preventDefault(); login();">
    <input type="text" id="fullname" placeholder="Täisnimi" required>
    <input type="password" id="password" placeholder="Parool" required>
    <button type="submit">Logi sisse</button>
  </form>
  <p id="errorMessage" style="color: red;"></p>

  <script>
    async function login() {
      const fullname = document.getElementById('fullname').value.trim();
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('errorMessage');
      errorMessage.textContent = '';

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ fullname, password })
        });

        const data = await response.json();

        if (data.success) {
          localStorage.setItem('jwtToken', data.token); // Store JWT in localStorage
          // Redirect the entire parent window to the CapRover success URL
          window.top.location.href = 'success.html';
        } else {
          errorMessage.textContent = 'Vale nimi või parool.';
        }
      } catch (error) {
        console.error('Login error:', error);
        errorMessage.textContent = 'Võrguviga või serveri viga.';
      }
    }
  </script>
</body>
</html>
