<!DOCTYPE html>
<html lang="et">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-translate="login_title">Guitarium Login</title>
  <link rel="stylesheet" href="styles.css">
  <script src="translations.js"></script>
</head>
<body onload="loggedin()">
  <h1 data-translate="login_heading">Logi sisse</h1>
  <form onsubmit="event.preventDefault(); login();">
    <input type="text" id="fullname" data-translate-placeholder="fullname_placeholder" placeholder="Ees- ja perekonnanimi" required>
    <input type="password" id="password" data-translate-placeholder="password_placeholder" placeholder="Parool" required>
    <button type="submit" data-translate="login_button">Logi sisse</button>
  </form>
  <p id="errorMessage" style="color: red;"></p>

  <script>
  function loggedin() {
      const token = localStorage.getItem('jwtToken');
      if (token) {
          console.log('User is logged in. Redirecting...');
          // Preserve language parameter when redirecting
          const urlParams = new URLSearchParams(window.location.search);
          const lang = urlParams.get('lang');
          const successUrl = lang ? `/success.html?lang=${lang}` : '/success.html';
          window.location.href = successUrl;
      } else {
          console.log('User is not logged in.');
      }
  }
    async function login() {
      const fullname = document.getElementById('fullname').value.trim();
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('errorMessage');
      errorMessage.textContent = '';

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ fullname, password })
        });

        const data = await response.json();

        if (data.success) {
          localStorage.setItem('jwtToken', data.token); // Store JWT in localStorage
          // Preserve language parameter when redirecting
          const urlParams = new URLSearchParams(window.location.search);
          const lang = urlParams.get('lang');
          const langParam = lang ? `?lang=${lang}` : '';

            window.location.href = `/admin/index.html${langParam}`;

          }
          else {
            window.location.href = `/success.html${langParam}`; // Redirect to the success page
          }
        } 
        else {
          errorMessage.textContent = t('wrong_credentials');
        }
      } catch (error) {
        console.error('Login error:', error);
        errorMessage.textContent = t('network_error');
      }
    }
  </script>
</body>
</html>
