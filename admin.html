<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Form</title>
</head>
<body>

    <form id="myForm">
        <input type="text" id="field1" placeholder="Field 1">
        <input type="text" id="field2" placeholder="Field 2">
        <input type="text" id="field3" placeholder="Field 3">
        <button type="submit">Submit</button>
    </form>

    <script>
        document.getElementById('myForm').addEventListener('submit', async (event) => {
            event.preventDefault(); // Stop the page from reloading

            const value1 = document.getElementById('field1').value;
            const value2 = document.getElementById('field2').value;
            const value3 = document.getElementById('field3').value;

            // This is the simplest fetch call
            const response = await fetch('/your-api-endpoint', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    key1: value1,
                    key2: value2,
                    key3: value3
                })
            });

            const result = await response.json();
            console.log(result); // See the server's response
        });
    </script>

</body>
</html>
